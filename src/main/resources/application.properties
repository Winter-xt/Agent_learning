spring.application.name=ai_project
spring.datasource.url=jdbc:mysql://localhost:3306/ai_project?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis (local deployment)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Vector index with resume keyword metadata filter fields
app.vector.index-name=talent-index-v4
app.vector.prefix=talent:v4:
app.resume.storage-dir=${user.home}/.ai_project/resumes

# Spring AI MCP Server (WebMVC SSE transport)
spring.ai.mcp.server.name=resume-rag-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=Expose resume RAG tools for candidate search, comparison, and resume question answering.
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.sse-endpoint=/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/messages

# MyBatis-Plus Config
mybatis-plus.type-aliases-package=com.ai.project.ai_project.domain
mybatis-plus.global-config.db-config.id-type=auto

# AI API Keys (from environment variables)
GEMINI_AI_KEY=${GEMINI_AI_KEY}
OPENAI_API_KEY=${OPENAI_API_KEY}
DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}

# Spring AI ChatClient (DeepSeek OpenAI-compatible API)
spring.ai.openai.api-key=${DEEPSEEK_API_KEY}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-chat
